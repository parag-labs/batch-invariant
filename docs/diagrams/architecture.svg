<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="740" viewBox="0 0 1560 740" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif"><defs><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2f9e6e"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e05561"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#4285f4"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8b5cf6"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e0a13a"/></marker><marker id="ah-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2aa5b0"/></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8494ab"/></marker><marker id="ah-white" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#c9d3e2"/></marker><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b2a4a" flood-opacity="0.10"/></filter></defs><rect width="1560" height="740" fill="#fbfcfe"/><text x="780.0" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="#16203a">BatchInvariant - same prompt, same token, any batch</text><text x="780.0" y="80" text-anchor="middle" font-size="14.5" fill="#6b7794">A batched matmul can flip a greedily-decoded token when the reduction order shifts with the batch - and the kernel that fixes it.</text><rect x="50" y="150" width="320" height="280" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#8494ab" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="68" y="141" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#3d4a63">SHARED SETUP</text><rect x="70" y="180" width="280" height="87" rx="14" fill="#e2ecfd" stroke="#4285f4" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(86,195) scale(0.8750)" fill="none" stroke="#4285f4" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l6 3.5-6 3.5z"/></g><text x="116" y="211" font-size="16.5" font-weight="700" fill="#17509f">One decode step</text><text x="87" y="233.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">logits = x @ wT, per token</text><text x="87" y="250.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">token = argmax, first-wins</text><rect x="70" y="290" width="280" height="104" rx="14" fill="#fdf1d6" stroke="#e0a13a" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(86,305) scale(0.8750)" fill="none" stroke="#e0a13a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v5a5 5 0 0 0 5 5h7"/><path d="M6 21v-5a5 5 0 0 1 5-5"/><path d="M15 10l3 3-3 3"/></g><text x="116" y="321" font-size="16.5" font-weight="700" fill="#8c5a0d">Reduction over K</text><text x="87" y="343.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">a dot product is a sum over K</text><text x="87" y="360.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">split-K: group, sum, combine</text><text x="87" y="378.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">sum_split == sum_flat in math</text><path d="M210,262 L210,288" stroke="#4285f4" stroke-width="2.0" fill="none" marker-end="url(#ah-blue)"/><rect x="470" y="150" width="1040" height="185" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#e05561" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="488" y="141" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#9e2b36">VARIANT KERNEL - THE BUG</text><rect x="495" y="185" width="460" height="104" rx="14" fill="#fde5e7" stroke="#e05561" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(511,200) scale(0.8750)" fill="none" stroke="#e05561" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v4a4 4 0 0 0 4 4h8"/><path d="M6 21v-4a4 4 0 0 1 4-4h8"/><path d="M15 8l3 3-3 3"/><path d="M15 14l3 3-3 3"/></g><text x="541" y="216" font-size="16.5" font-weight="700" fill="#9e2b36">splits_for_batch(batch)</text><text x="512" y="238.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">8 splits alone, 2 in a batch of 4</text><text x="512" y="255.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">grouping chosen by batch size</text><text x="512" y="273.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">so a row moves with its batch</text><rect x="1015" y="185" width="470" height="104" rx="14" fill="#fde5e7" stroke="#e05561" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1031,200) scale(0.8750)" fill="none" stroke="#e05561" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 16H3z"/><path d="M12 9v5"/><path d="M12 17.2v.1"/></g><text x="1061" y="216" font-size="16.5" font-weight="700" fill="#9e2b36">token flips</text><text x="1032" y="238.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">alone -&gt; token 1</text><text x="1032" y="255.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">in a batch of 4 -&gt; token 0</text><text x="1032" y="273.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">same prompt, different token</text><path d="M957,235 L1013,235" stroke="#e05561" stroke-width="2.0" fill="none" marker-end="url(#ah-pink)"/><rect x="470" y="380" width="1040" height="185" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#2f9e6e" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="488" y="371" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#186547">INVARIANT KERNEL - THE FIX</text><rect x="495" y="415" width="460" height="104" rx="14" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(511,430) scale(0.8750)" fill="none" stroke="#2f9e6e" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></g><text x="541" y="446" font-size="16.5" font-weight="700" fill="#186547">FIXED_SPLITS = 4</text><text x="512" y="468.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">same grouping for any batch</text><text x="512" y="485.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">row = pure fn(row, weights)</text><text x="512" y="503.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">the value doesn't matter, fixity does</text><rect x="1015" y="415" width="470" height="104" rx="14" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1031,430) scale(0.8750)" fill="none" stroke="#2f9e6e" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.6 2.6L16 9.6"/></g><text x="1061" y="446" font-size="16.5" font-weight="700" fill="#186547">token stable</text><text x="1032" y="468.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">alone -&gt; token 1</text><text x="1032" y="485.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">batched -&gt; token 1</text><text x="1032" y="503.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">bit-identical either way</text><path d="M957,465 L1013,465" stroke="#2f9e6e" stroke-width="2.0" fill="none" marker-end="url(#ah-green)"/><path d="M352,342 L405.0,342.0 Q420,342 420.0,327.0 L420.0,250.0 Q420,235 435.0,235.0 L493,235" stroke="#e05561" stroke-width="2.0" fill="none" marker-end="url(#ah-pink)"/><rect x="384.224" y="283.0" width="71.55199999999999" height="24.0" rx="12" fill="#ffffff" stroke="#e05561" stroke-opacity="0.4"/><text x="420" y="299.44" text-anchor="middle" font-size="12" font-weight="600" fill="#9e2b36">by batch</text><path d="M352,342 L405.0,342.0 Q420,342 420.0,357.0 L420.0,450.0 Q420,465 435.0,465.0 L493,465" stroke="#2f9e6e" stroke-width="2.0" fill="none" marker-end="url(#ah-green)"/><rect x="395.024" y="393.0" width="49.952" height="24.0" rx="12" fill="#ffffff" stroke="#2f9e6e" stroke-opacity="0.4"/><text x="420" y="409.44" text-anchor="middle" font-size="12" font-weight="600" fill="#186547">fixed</text><rect x="50" y="590" width="720" height="95.19999999999999" rx="11" fill="#eef1f6" stroke="#8494ab" stroke-width="1.4" stroke-opacity="0.8"/><text x="66" y="614" font-size="13.2" font-weight="700" fill="#3d4a63">The mechanism, exactly</text><text x="66" y="636" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">sum_split groups the K sum, adds each chunk then the partials - equal to sum_flat in exact math.</text><text x="66" y="654.4" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">splits_for_batch(n) = max(1, 8//n): fewer rows split K further, so the batch leaks into the rounding.</text><text x="66" y="672.8" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">The variant kernel is deterministic given the batch - the batch is the hidden input.</text><rect x="790" y="590" width="720" height="95.19999999999999" rx="11" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.4" stroke-opacity="0.8"/><text x="806" y="614" font-size="13.2" font-weight="700" fill="#186547">Honest about the flip</text><text x="806" y="636" font-size="12.4" fill="#186547" fill-opacity="0.92">A flip needs two logits tied within the rounding error - rare, so flip_case builds one (seed 514).</text><text x="806" y="654.4" font-size="12.4" fill="#186547" fill-opacity="0.92">Rare isn't safe: a nonzero probability already breaks a reproducibility guarantee.</text><text x="806" y="672.8" font-size="12.4" fill="#186547" fill-opacity="0.92">Non-goals: not a GPU kernel, not hardware nondeterminism, not a full attention stack.</text><text x="780.0" y="722" text-anchor="middle" font-size="12" fill="#6b7794">parag-labs/batch-invariant</text></svg>